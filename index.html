stalaciones y especialistas ambientales."],"openingTitle":"1. El escenario es ficticio; el razonamiento es transferible","practical":{"correct":2,"feedbackCorrect":"Correcto. La decisión respeta las condiciones innegociables, evita una falsa compensación, prioriza la evitación y mantiene visibles las condiciones y la incertidumbre.","feedbackIncorrect":"Todavía no. Los beneficios ambientales en lugares diferentes no pueden intercambiarse sin más, y un suelo ya sellado puede seguir generando impactos de drenaje, iluminación u operación.","intro":"Caso ficticio combinado: la opción A amplía la zona de soporte A400M sobre un pastizal seminatural conectado y ofrece el plazo más corto. La opción B reorganiza suelo ya sellado, añade tiempo a la logística interna y exige rediseñar la iluminación. La opción C utiliza un suelo de menor calidad, pero modifica el drenaje junto a una charca estacional. Paralelamente, un proveedor de componentes Eurofighter propone un material de menor masa con datos incompletos sobre su origen; las pruebas de cualificación aún no han terminado.","options":["Seleccionar A y compensar la pérdida del pastizal con el componente de menor masa.","Seleccionar B inmediatamente porque el suelo ya sellado siempre carece de impacto.","Priorizar B para el diseño detallado porque evita la transformación directa del hábitat, verificar los controles de iluminación y logística, mantener C como alternativa condicionada y evaluar el componente únicamente cuando las evidencias de origen y cualificación sean suficientes."],"steps":["Mantén las decisiones sobre la instalación y el componente suficientemente separadas para evitar una falsa compensación.","Aplica primero las condiciones de seguridad y aeronavegabilidad.","Analiza la evitación, solicita evidencias específicas de la ubicación y valora la incertidumbre.","Define aprobaciones condicionadas, umbrales de seguimiento y responsables.","Redacta una declaración de decisión que no afirme un resultado neto."],"takeaway":"Integrar significa comparar las compensaciones de forma transparente, no reducirlas a una única puntuación conveniente.","title":"Decisión final"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 6.1: Enmarcar la decisión antes de comparar alternativas"},{"kicker":"6.1.1","paragraphs":["Expresa la necesidad operativa en términos funcionales. «Construir una nueva zona» es una solución propuesta; «disponer de capacidad segura para determinadas tareas de mantenimiento antes de una fecha» es la necesidad. Mantener la necesidad separada permite analizar la programación, la distribución, la capacidad existente y alternativas fuera del emplazamiento.","Define el perímetro a través de las etapas del ciclo de vida y las ubicaciones relevantes. La decisión sobre la zona de apoyo incluye suelo, drenaje, iluminación, tráfico y mantenimiento. La decisión sobre el componente incluye el origen del material, el procesado, la logística, las prestaciones, la cualificación y el final de vida.","Identifica a la persona responsable de la decisión y a los revisores técnicos. La evidencia de biodiversidad informa la decisión, pero ningún indicador ambiental aislado prevalece sobre la aeronavegabilidad, la seguridad operativa o la protección. El registro debe mostrar cómo se integraron las restricciones y los riesgos residuales."],"title":"6.1.1: Definir la necesidad, el perímetro y el responsable"},{"figureLabel":"Huella operativa y entorno ecológico","figureSrc":"images/m3/m3-caso.jpg","kicker":"6.1.2","paragraphs":["Para cada alternativa, identifica dependencias como la disponibilidad de agua, la regulación de inundaciones, la estabilidad del suelo, los materiales biológicos y los servicios ecosistémicos de los proveedores. Después identifica presiones como la ocupación del suelo, la captación de agua, la contaminación, el ruido, la luz, el transporte y la transformación aguas arriba.","No clasifiques todas las relaciones como materiales. Puntúa la plausibilidad y gravedad de la vía, la sensibilidad de la ubicación, la reversibilidad, la confianza de la evidencia y la solidez del control. Separa los hechos conocidos de los supuestos.","Un registro útil incluye: actividad, ubicación, receptor, presión o dependencia, evidencia, incertidumbre, control existente, acción adicional, responsable y fecha de decisión. Es un documento de control vivo, no el resultado aislado de un taller."],"title":"6.1.2: Construir el registro de dependencias e impactos"},{"kicker":"Capítulo","paragraphs":[],"title":"3. CAPÍTULO 6.2: Comparar alternativas sin falsa precisión"},{"kicker":"6.2.1","paragraphs":["Algunos criterios son condiciones de paso: el cumplimiento legal, la aeronavegabilidad, la seguridad y las restricciones sobre especies protegidas no pueden intercambiarse por puntos en otros aspectos. Otros criterios sí pueden compararse, como el suelo alterado, la demanda de agua, el coste, el plazo, la evidencia del proveedor y la reversibilidad.","Cuando sea posible, las ponderaciones deben acordarse antes de puntuar. Si la alternativa preferida cambia por pequeñas variaciones de los pesos, la decisión es sensible y no debe presentarse como evidente. Muestra el intervalo, no únicamente la puntuación ganadora.","Una puntuación alta no compensa la ausencia de evidencia crítica. Utiliza niveles de confianza y aprobaciones condicionadas: una alternativa solo podrá avanzar después de un estudio estacional, una prueba de drenaje, una auditoría del proveedor o un resultado de cualificación."],"title":"6.2.1: Análisis multicriterio y condiciones innegociables"},{"figureLabel":"Línea base, umbral y respuesta adaptativa","figureSrc":"images/m1/m1-apoyo.jpg","kicker":"6.2.2","paragraphs":["La incertidumbre no obliga a detener todas las decisiones. Modifica la estrategia de control. Cuando el daño potencial es grave o irreversible, deben conservarse las opciones de evitación y reunirse evidencias más sólidas. Cuando los efectos son limitados y reversibles, puede resultar proporcionado un proyecto piloto sometido a seguimiento.","La gestión adaptativa define los desencadenantes por adelantado. Por ejemplo: si el nivel de agua observado desciende por debajo de un umbral, se suspende la actividad y se investiga; si la trazabilidad del proveedor no se verifica antes del punto de decisión, se congela la ampliación de esa fuente; si el estado del hábitat no mejora, se revisa el método de restauración.","Un desencadenante necesita una métrica, una frecuencia, un responsable, una actuación y autoridad. «Supervisar de cerca» no es un control operativo."],"title":"6.2.2: Incertidumbre, reversibilidad y controles adaptativos"},{"kicker":"Capítulo","paragraphs":[],"title":"4. CAPÍTULO 6.3: Registro de decisión y comunicación"},{"kicker":"6.3.1","paragraphs":["El expediente debe contener la necesidad funcional, las alternativas consideradas, las restricciones innegociables, el perímetro espacial, la línea base, el registro de presiones y dependencias, las fuentes de evidencia, la incertidumbre, la secuencia de mitigación, los controles seleccionados, los responsables, las implicaciones de coste y plazo, los umbrales de seguimiento y el impacto residual.","Incluye las alternativas rechazadas y sus motivos. Esto demuestra que la evitación se analizó realmente y permite a revisores posteriores comprender las compensaciones. Vincula cada afirmación material con su evidencia, en lugar de copiar conclusiones entre presentaciones.","Programa una revisión posterior a la decisión. Los nuevos estudios, la información de proveedores o la experiencia operativa pueden modificar la evaluación."],"title":"6.3.1: Contenido de un expediente de decisión revisable"},{"kicker":"6.3.2","paragraphs":["El mensaje interno o externo debe ser más limitado que el expediente de decisión. Puede describir con precisión un control implantado o un resultado medido dentro de un perímetro definido. No debe traducir una alternativa preferida en «positivo para la naturaleza» ni insinuar que un proyecto representa toda la huella del programa.","Una estructura adecuada es: actuación + objeto + perímetro + línea base + resultado medido + método + limitación. Ejemplo: «Dentro del perímetro del emplazamiento ficticio de formación, la distribución seleccionada evita la transformación directa de la zona de protección cartografiada de la charca estacional; los riesgos residuales de drenaje y molestias permanecen sujetos a los umbrales de seguimiento definidos».","Observa lo que la frase no afirma: no demuestra una ganancia neta de biodiversidad, no elimina los impactos aguas arriba ni describe el desempeño oficial de Airbus."],"title":"6.3.2: Del registro técnico a una afirmación creíble"},{"kicker":"5","paragraphs":["Una decisión sólida sobre biodiversidad no es la alternativa con más lenguaje ambiental. Es aquella cuya necesidad, evidencias, alternativas, secuencia de mitigación, responsabilidad, incertidumbre e impacto residual pueden ser reconstruidos por una persona revisora independiente."],"title":"5. Resumen del laboratorio final"}],"sources":[{"label":"TNFD: enfoque de evaluación LEAP","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"},{"label":"Science Based Targets Network: marco de actuación AR3T","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/act/"},{"label":"Airbus: capacidades de observación de la Tierra","url":"https://www.airbus.com/en/products-services/space/earth-observation"},{"label":"EFRAG: ESRS E4 Biodiversidad y Ecosistemas","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}],"support":"images/m3/m3-caso.jpg","tag":"Laboratorio final","theme":{"accent":"#355f49","ink":"#15202b","line":"#5d846f","panel":"#f3f6f4","soft":"#dfe9e3"},"title":"Laboratorio de decisiones sobre naturaleza para A400M y Eurofighter"}]};

const qs = sel => document.querySelector(sel);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function parseSectionHeading(rawTitle,kicker){
  const colonIndex = rawTitle.indexOf(':');
  const prefix = colonIndex >= 0 ? rawTitle.slice(0, colonIndex).trim() : '';
  const rest = colonIndex >= 0 ? rawTitle.slice(colonIndex + 1).trim() : rawTitle;
  let cleanPrefix = prefix;
  const dotSpaceIndex = cleanPrefix.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = cleanPrefix.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits) cleanPrefix = cleanPrefix.slice(dotSpaceIndex+2);
  }
  const upperPrefix=cleanPrefix.toUpperCase(); if(upperPrefix.startsWith('CHAPTER ')||upperPrefix.startsWith('CAPÍTULO ')) return {eyebrow:upperPrefix, title:rest, isChapter:true};
  const isNumbered = prefix.length>0 && [...prefix].every(ch=>(ch>='0'&&ch<='9')||ch==='.');
  if(isNumbered) return {eyebrow:prefix,title:rest,isChapter:false};
  return {eyebrow:String(kicker||'').toUpperCase(), title:rawTitle, isChapter:['CHAPTER','CAPÍTULO'].includes(String(kicker||'').toUpperCase())};
}
function splitLeadText(text){const i=text.indexOf(':'); return i>0 && i<95 ? {lead:text.slice(0,i+1),rest:text.slice(i+1).trim()} : {lead:'',rest:text};}
function figureHtml(src,label,tone,tall=false){
  const cls = tall ? 'media' : 'media short';
  return `<div class="${cls}" style="border-color:${tone.line};background:${tone.soft}"><img src="${esc(src)}" alt="${esc(label)}" onerror="this.parentElement.innerHTML=window.figureFallback('${esc(label)}','${esc(tone.line)}','${esc(tone.soft)}','${esc(tone.panel)}')"><div class="label">${esc(label)}</div></div>`;
}
window.figureFallback=(label,line,soft,panel)=>`<div class="media short" style="border-color:${line};background:linear-gradient(135deg,${soft} 0%, #fff 55%, ${panel} 100%)"><div class="fallback"><div class="fallback-inner"><div class="ficon"></div><div class="label">${label}</div></div></div></div>`;
function renderParagraph(paragraph,accent){
  const trimmed = String(paragraph||'').trim(); if(!trimmed) return '';
  if(trimmed.startsWith('* ')){
    const parts=splitLeadText(trimmed.slice(2).trim());
    return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
  }
  const isLetteredHeading = /^[A-Z]\.\s/.test(trimmed);
  if(isLetteredHeading) return `<div class="box-title">${esc(trimmed)}</div>`;
  const dotSpaceIndex = trimmed.indexOf('. ');
  if(dotSpaceIndex>0){
    const maybeNumber = trimmed.slice(0,dotSpaceIndex);
    const isOnlyDigits = [...maybeNumber].every(ch=>ch>='0'&&ch<='9');
    if(isOnlyDigits){
      const parts=splitLeadText(trimmed.slice(dotSpaceIndex+2));
      return `<div class="numbox"><div class="numrow"><div class="numbadge" style="background:${accent}18;color:${accent}">${esc(maybeNumber)}</div><p>${parts.lead?`<strong>${esc(parts.lead)}</strong> `:''}${esc(parts.rest)}</p></div></div>`;
    }
  }
  if(trimmed.endsWith(':')) return `<div class="box-title">${esc(trimmed)}</div>`;
  const parts=splitLeadText(trimmed); const hasLead=!!parts.lead && parts.lead.length<80;
  if(hasLead) return `<div class="highlight"><div class="leadrow"><div class="dot" style="background:${accent}"></div><p><strong>${esc(parts.lead)}</strong> ${esc(parts.rest)}</p></div></div>`;
  return `<div class="para"><p>${esc(trimmed)}</p></div>`;
}

      return `<article class="program-card"><div class="program-grid"><div class="media-wrap" style="background:${m.theme.panel}">${figureHtml(m.hero,`${m.index} · portada`,m.theme,true)}</div><div class="program-body"><div class="p-top"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="background:${m.theme.soft}">${icons[m.id]||'•'}</div><div><div class="eyebrow">Módulo ${esc(m.index)}</div><div style="margin-top:4px;font-size:14px;color:#64748b">${esc(m.duration)}</div></div></div><span class="tag" style="background:${m.theme.soft};color:${m.theme.accent}">${esc(m.tag)}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.objective)}</p><div class="section-preview">${m.sections.slice(0,4).map(s=>{const h=parseSectionHeading(s.title,s.kicker);return `<div class="section-box"><div class="eyebrow">${esc(h.eyebrow)}</div><div style="margin-top:8px;font-size:14px;line-height:1.7;color:#1f2937;font-weight:500">${esc(h.title)}</div></div>`}).join('')}</div><div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="open-btn" style="background:${m.theme.accent}" onclick="openModule('${m.id}')">Abrir módulo →</button><span style="font-size:14px;color:#64748b">Teoría ampliada · caso aplicado · autoevaluación</span></div></div></div></article>`
    }).join('')}</section>`;

}

function evaluationHtml(module){
  if(!module.evaluation) return '';
  const e=module.evaluation;
  return `<section class="article-card"><div class="article-grid"><div class="article-side" style="background:${module.theme.soft}"><div><div style="font-size:18px;color:${module.theme.accent}">📝</div><div class="eyebrow" style="margin-top:12px">Evaluación</div></div></div><div class="article-content"><h3>${esc(e.title)}</h3><div class="section-box" style="margin-top:20px"><div class="eyebrow">Pregunta</div><p style="margin:12px 0 0;font-size:16px;line-height:2;color:#334155">${esc(e.question)}</p></div>${choiceHtml('quiz-'+module.id,e,module.theme.accent,'Comprobar respuesta')}</div></div></section>`;
}
function sourcesHtml(module){
  if(!module.sources||!module.sources.length) return '';
  return `<section class="meta-white"><div class="eyebrow">Fuentes de evidencia</div><h3 style="margin:10px 0 0;font-size:24px;color:#1b1e25">Continuar con las fuentes primarias</h3><div class="source-list">${module.sources.map(s=>`<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`).join('')}</div></section>`;
}
function moduleHtml(module){
  const nextIndex=DATA.modules.findIndex(x=>x.id===module.id)+1;
  const next=DATA.modules[nextIndex]||null;
  return `<div class="module-layout"><aside class="sticky stack"><div class="meta-dark"><div style="display:flex;gap:12px;align-items:center"><div class="module-icon" style="border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05)">${icons[module.id]||'•'}</div><div><div class="eyebrow" style="color:rgba(255,255,255,.45)">Módulo ${esc(module.index)}</div><div style="margin-top:4px;font-size:14px;color:rgba(255,255,255,.65)">${esc(module.duration)}</div></div></div><h2 style="margin:20px 0 0;font-size:28px;line-height:1.08;color:#f8f3ec">${esc(module.title)}</h2><p style="font-size:14px;line-height:2;color:rgba(255,255,255,.7)">${esc(module.objective)}</p><div style="margin-top:20px"><span class="chip">${esc(module.tag)}</span></div></div></aside><div class="stack"><section class="article-card"><div class="program-grid" style="grid-template-columns:1.05fr .95fr"><div style="padding:24px 32px;background:${module.theme.panel}"><div class="eyebrow">Apertura del módulo</div><h1 style="margin:12px 0 0;max-width:900px;font-size:58px;line-height:.98;letter-spacing:-.04em;color:#1b1e25">${esc(module.title)}</h1>${module.openingTitle&&module.openingParagraphs?`<h2 style="margin:24px 0 0;font-size:32px;line-height:1.08;letter-spacing:-.02em;color:#1b1e25">${esc(module.openingTitle)}</h2><div class="block-list" style="margin-top:16px">${module.openingParagraphs.map(p=>renderParagraph(p,module.theme.accent)).join('')}</div>`:`<p style="margin-top:20px;font-size:16px;line-height:2;color:#475569">${esc(module.objective)}</p>`}</div><div class="media-wrap" style="background:${module.theme.soft}">${figureHtml(module.hero,`${module.index} · hero`,module.theme,true)}</div></div></section>${module.sections.map(s=>articleHtml(s,module)).join('')}${practicalHtml(module)}${evaluationHtml(module)}${sourcesHtml(module)}${module.closing?`<section class="footer-close"><div class="eyebrow" style="color:rgba(255,255,255,.45)">Cierre</div><p style="margin:16px 0 0;font-size:16px;line-height:2;color:rgba(255,255,255,.78)">${esc(module.closing)}</p></section>`:''}<section class="meta-white"><div class="eyebrow">Navegación</div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center"><button class="small-card" style="padding:12px 16px;text-align:left" onclick="goProgram()">← Programa</button>${next?`<button class="open-btn" style="background:#020617;justify-content:center" onclick="openModule('${next.id}')">Siguiente →</button>`:''}</div></section></div></div>`;
}
function setActiveNav(){ qs('#nav-home').classList.toggle('active',state.view==='home'); qs('#nav-program').classList.toggle('active',state.view==='program'||state.view.startsWith('m')); }
function render(){
  qs('#brand-title').textContent=DATA.course.title; qs('#brand-sub').textContent=DATA.course.subtitle;
  qs('#home-view').innerHTML=homeHtml();
  qs('#program-view').innerHTML=programHtml();
  qs('#module-view').innerHTML=state.currentModule?moduleHtml(state.currentModule):'';
  qs('#home-view').classList.toggle('hidden',state.view!=='home');
  qs('#program-view').classList.toggle('hidden',state.view!=='program');
  qs('#module-view').classList.toggle('hidden',!state.currentModule);
  setActiveNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){state.view='home'; state.currentModule=null; render();}
function goProgram(){state.view='program'; state.currentModule=null; render();}
function openModule(id){ const m=DATA.modules.find(x=>x.id===id); state.view=id; state.currentModule=m||null; render(); }
function resolveChoice(key){
  const parts=String(key).split('-'),kind=parts.shift(),id=parts.join('-');
  const module=DATA.modules.find(m=>m.id===id);
  if(!module) return null;
  return {module,block:kind==='practice'?module.practical:module.evaluation,kind};
}
function chooseOption(key,index){
  state.answers[key]=index;
  document.querySelectorAll('[data-choice="'+key+'"]').forEach(btn=>{
    const selected=Number(btn.dataset.index)===index;
    btn.classList.toggle('selected',selected);
    btn.setAttribute('aria-checked',String(selected));
  });
  const submit=document.getElementById('submit-'+key);
  if(submit) submit.disabled=false;
  const feedback=document.getElementById('feedback-'+key);
  if(feedback){feedback.className='choice-feedback hidden';feedback.textContent='';}
}
function submitChoice(key){
  const resolved=resolveChoice(key),selected=state.answers[key];
  if(!resolved||selected===undefined) return;
  const correct=selected===resolved.block.correct;
  const feedback=document.getElementById('feedback-'+key);
  if(feedback){
    feedback.textContent=correct?resolved.block.feedbackCorrect:resolved.block.feedbackIncorrect;
    feedback.className='choice-feedback '+(correct?'correct':'incorrect');
  }
  if(correct&&resolved.kind==='quiz'){
    state.completed[resolved.module.id]=true;
    try{localStorage.setItem('airbusNatureCourseProgressES',JSON.stringify(state.completed));}catch{}
  }
}
window.chooseOption=chooseOption; window.submitChoice=submitChoice;
window.goHome=goHome; window.goProgram=goProgram; window.openModule=openModule;
qs('#nav-home').onclick=goHome; qs('#nav-program').onclick=goProgram;
render();
</script>
</body>
</html>
