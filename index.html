  <style>
    :root{--bg:#efe9df;--panel:#fff;--ink:#1b1e25;--muted:#5b6672;--line:rgba(15,23,42,.08);--dark:#17191f;--gold:#d6b07d;--shadow:0 22px 60px -48px rgba(0,0,0,.28);--shadow-lg:0 35px 90px -45px rgba(0,0,0,.55);--radius:30px;}

    .hero h1{margin:0;font-size:clamp(48px,4.2vw,72px);line-height:.92;letter-spacing:-.05em;color:#f7f1e8;font-weight:700;max-width:8.5ch}

    .choice-feedback.correct{background:#e7f5ec;color:#185c35;border:1px solid #b9dfc7}
    .choice-feedback.incorrect{background:#fff1e8;color:#8a3d16;border:1px solid #f2c6ad}
    .source-list{display:grid;gap:10px;margin-top:16px}
    .source-link{display:block;border-radius:16px;border:1px solid rgba(0,0,0,.08);background:#fff;padding:13px 15px;color:#334155;text-decoration:none;line-height:1.55}
    .source-link:hover,.source-link:focus-visible{border-color:#64748b;text-decoration:underline;outline:3px solid rgba(100,116,139,.14)}
    .progress-track{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden}
    .progress-fill{height:100%;border-radius:999px;background:#355f49;transition:width .25s ease}

    @media (max-width: 1100px){.grid-home,.module-layout{grid-template-columns:1fr} .hero-grid,.program-grid,.article-grid{grid-template-columns:1fr} .program-body{border-left:0;border-top:1px solid rgba(0,0,0,.06)} .article-side{min-height:100px} .hero h1{font-size:58px} .program-header h1{font-size:48px} .section-preview{grid-template-columns:1fr} .sticky{position:static} }
    @media (max-width: 700px){.hero-grid{padding:24px} .hero h1{font-size:42px} .program-body h3{font-size:34px} .program-header h1{font-size:38px} .shell{padding:0 12px} .page{padding:20px 0 28px}}

<script>
const DATA = {"course":{"intro":"Un recorrido formativo estructurado para profesionales del sector aeronáutico que necesitan comprender cómo interactúan el clima, la biodiversidad, el suelo, el agua y los materiales con las decisiones industriales. Cada módulo conecta los conceptos científicos con la evidencia operativa, las compras, la gobernanza y la comunicación responsable.","structure":["Teoría explicada desde los fundamentos, con ejemplos aeronáuticos.","Un caso de decisión en cada módulo, con datos ficticios pero realistas.","Una comprobación interactiva de conocimientos con feedback técnico.","Fuentes de evidencia y límites claros sobre lo que pueden demostrar los datos.","Progreso guardado en este navegador para poder continuar más adelante."],"subtitle":"Curso digital avanzado · Contexto Airbus","title":"Sostenibilidad aeronáutica: evidencias y decisiones"},"modules":[{"case":"images/m1/m1-caso.jpg","closing":"El criterio técnico comienza separando conceptos que a menudo se mezclan en la comunicación: una presión no es un impacto, una actividad no es un resultado, el carbono no es biodiversidad y la restauración no implica equivalencia automática.","duration":"90–110 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. El clima y la biodiversidad interactúan, pero sus métricas, escalas espaciales y vías causales son diferentes.","feedbackIncorrect":"Revisa los apartados sobre niveles de biodiversidad, líneas base y vías de presión. Una métrica no puede sustituir a otra cuestión ambiental.","options":["Una reducción de carbono demuestra automáticamente que el impacto local sobre la biodiversidad es positivo.","La biodiversidad requiere evidencias específicas de la ubicación sobre el estado ecológico y las presiones; los datos de carbono pueden informar el análisis, pero no sustituirlo.","Un recuento de especies es suficiente porque el estado y la conectividad de los ecosistemas son secundarios."],"question":"¿Qué afirmación distingue mejor la gestión de la biodiversidad de la gestión del carbono?","title":"Comprobación de conocimientos"},"hero":"images/m1/m1-caso.jpg","id":"m1","index":"01","objective":"Construir la base científica necesaria para distinguir clima, biodiversidad, estado de los ecosistemas, dependencias, impactos y riesgos relacionados con la naturaleza, y utilizar esas diferencias en las decisiones aeronáuticas.","openingParagraphs":["El cambio climático y la pérdida de biodiversidad están conectados, pero no son intercambiables. La contabilidad de carbono analiza los flujos de gases de efecto invernadero; la evaluación de la biodiversidad estudia qué está ocurriendo con los genes, las especies, los ecosistemas y los procesos ecológicos que mantienen su funcionamiento. Un proyecto puede reducir emisiones y, al mismo tiempo, dañar un humedal, fragmentar un hábitat o aumentar el estrés hídrico. Del mismo modo, una actuación de restauración puede mejorar el estado ecológico local sin anular un impacto climático distinto.","Para el personal del sector aeronáutico, la cuestión práctica no es si la naturaleza es importante en abstracto. Hay que determinar dónde depende una actividad del agua, de materiales biológicos, de la estabilidad del suelo, de la regulación de inundaciones o de otros servicios ecosistémicos; dónde genera presiones; y cómo esas relaciones pueden convertirse en riesgos operativos, jurídicos, financieros o reputacionales. Este módulo establece el vocabulario y la lógica de decisión utilizados en todo el curso."],"openingTitle":"1. Por qué la contabilidad de carbono no es suficiente","practical":{"correct":1,"feedbackCorrect":"Correcto. La evidencia está incompleta; la decisión defendible consiste en conservar alternativas, comprobar la evitación y cerrar las lagunas específicas de la ubicación antes de comprometerse.","feedbackIncorrect":"Todavía no. La propuesta omite la evitación o utiliza una métrica climática como sustituto de la biodiversidad. Revisa la vía de presión y la secuencia de mitigación.","intro":"Escenario formativo ficticio: una instalación de soporte A400M necesita 2.400 m² adicionales de plataforma pavimentada. La opción A utiliza suelo ya sellado, pero añade 180 metros a los desplazamientos internos de vehículos. La opción B resulta operativamente cómoda, pero elimina un pastizal rico en especies conectado con una charca estacional. La opción C afecta a un pastizal de menor calidad, evita la zona de protección de la charca y exige rediseñar el drenaje. Solo se dispone de un estudio ecológico de primavera, por lo que persiste la incertidumbre.","options":["Elegir la opción B y compensar plantando árboles en otro lugar.","Detener la selección definitiva, comprobar si A o C pueden cubrir la necesidad, cerrar las lagunas estacionales y aplicar la jerarquía de mitigación antes de abordar el impacto residual.","Utilizar la huella anual de carbono de la instalación como indicador decisivo de biodiversidad."],"steps":["Define la necesidad operativa y las restricciones de seguridad no negociables.","Compara las alternativas de evitación antes de hablar de plantaciones o compensaciones.","Solicita evidencias estacionales sobre la charca, la vía de drenaje, las especies protegidas y la conectividad del hábitat.","Documenta la opción seleccionada, los impactos residuales, los controles, el umbral de seguimiento y el responsable."],"takeaway":"Las buenas decisiones sobre biodiversidad mantienen abierta la posibilidad de evitar daños mientras se reduce la incertidumbre.","title":"Caso de decisión: ampliación de un área de soporte A400M"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 1.1: El Marco Científico: ¿Cómo funciona el Sistema Tierra?"},{"figureLabel":"Infraestructura invisible","figureSrc":"images/m1/m1-apoyo.jpg","kicker":"1.1.1","paragraphs":["Para un profesional de la aviación, la infraestructura son las pistas, los hangares y los satélites. Para el planeta, la infraestructura son los Servicios Ecosistémicos: los beneficios que la naturaleza nos da de forma gratuita y sin los cuales Airbus no podría operar.","1. Servicios de Regulación: Los bosques y océanos absorben el 50% de nuestras emisiones de CO2. Son \"sumideros de carbono\" naturales. Si la biodiversidad de estos bosques se degrada (por incendios, plagas o deforestación), el CO2 se queda en la atmósfera, el calentamiento se acelera y las condiciones de vuelo se vuelven más peligrosas y costosas.","2. Servicios de Provisión: La naturaleza nos suministra materiales físicos. El agua dulce para el tratamiento de superficies en nuestras plantas y, fundamentalmente, materiales biológicos como el caucho natural.","3. Servicios de Soporte: Procesos como el ciclo de los nutrientes y la formación de suelo que mantienen la estabilidad económica de las regiones donde Airbus tiene sus sedes y clientes."],"title":"1.1.1: Servicios Ecosistémicos: La Infraestructura Invisible de Airbus"},{"figureLabel":"Límites planetarios","figureSrc":"images/m1/m1-apoyo.jpg","kicker":"1.1.2","paragraphs":["Para que un empleado de Airbus entienda la urgencia, debemos hablar del concepto de Límites Planetarios (Planetary Boundaries). Este marco fue creado en 2009 por el Stockholm Resilience Centre para definir los umbrales que la humanidad no debe cruzar si quiere mantener la estabilidad de la Tierra.","Imagina que la Tierra tiene una \"Envolvente de Vuelo\" (Flight Envelope). Si el avión se sale de ella, entra en una situación de pérdida (stall) o fallo estructural. Los científicos han identificado 9 límites que actúan como nuestros indicadores de vuelo:","1. Cambio Climático: Mide la concentración de CO2. (Superado).","2. Integridad de la Biosfera (Biodiversidad): Mide la extinción de especies. Es el límite más crítico. (Severamente Superado).","3. Cambio de Uso del Suelo: Conversión de bosques en granjas. (Superado).","4. Uso del Agua Dulce: Alteración de ríos y acuíferos. (Superado).","5. Flujos Biogeoquímicos: Exceso de nitrógeno y fósforo en el agua. (Superado).","6. Nuevas Entidades: Contaminación por plásticos, químicos y materiales sintéticos. (Superado).","7. Acidificación de los Océanos: El mar se vuelve ácido al absorber CO2, matando el coral.","8. Agotamiento de la Capa de Ozono: El único límite que estamos logrando recuperar.","9. Carga de Aerosoles Atmosféricos: Partículas de polvo y humo que afectan al clima.","¿Por qué es vital para Airbus? Porque ya hemos cruzado 6 de los 9 límites. Esto significa que estamos operando en \"aire turbulento\". La transgresión de estos límites genera una imprevisibilidad climática y de recursos que destruye la planificación financiera y logística de cualquier empresa industrial."],"title":"1.1.2: Los 9 Límites Planetarios: El \"Flight Envelope\" Global"},{"kicker":"1.1.3","paragraphs":["El pensamiento de ciclo de vida sigue un producto o programa a través de la extracción de materias primas, la transformación, la fabricación de componentes, el ensamblaje, el uso, el mantenimiento y el final de vida. Su finalidad es evitar el traslado de impactos: un componente más ligero puede reducir el consumo de combustible y, a la vez, incrementar en otro lugar la presión minera, el consumo de agua o la toxicidad del procesado.","En programas como A400M o Eurofighter, una evaluación preliminar no debe simular que calcula una huella de biodiversidad única y completa a partir de datos limitados. Primero debe identificar familias de materiales, ubicaciones, volúmenes, niveles de proveedores y vías de presión plausibles. Las combinaciones de mayor riesgo —por ejemplo, una ubicación sensible, una materia prima intensiva en suelo y una trazabilidad débil— se someten después a una evaluación más profunda.","* Alcance 3 y cadena de valor: muchos impactos y dependencias materiales se encuentran fuera de las operaciones directas. Los cuestionarios a proveedores son útiles, pero las afirmaciones requieren evidencias como ubicaciones, registros de cadena de custodia, metodologías, periodos de tiempo y aseguramiento.","* Regla de decisión: utiliza las estimaciones para priorizar la investigación, no para presentar valores inciertos como si fueran mediciones. Registra los supuestos, las lagunas de datos y el nivel de confianza junto con cada resultado."],"title":"1.1.3: El reto del ciclo de vida y el Alcance 3"},{"kicker":"Capítulo","paragraphs":[],"title":"3. CAPÍTULO 1.2: Riesgos Estratégicos y Dependencias Críticas"},{"figureLabel":"Dependencia crítica del caucho","figureSrc":"images/m1/m1-caso.jpg","kicker":"1.2.1","paragraphs":["Los neumáticos aeronáuticos muestran cómo un sistema industrial puede depender de la biodiversidad a través de una materia prima biológica. El caucho natural posee propiedades mecánicas que siguen siendo importantes bajo cargas exigentes y ciclos térmicos. La enseñanza no es que una sola especie genere automáticamente un riesgo corporativo cuantificado, sino que la concentración de la producción, la uniformidad genética, las enfermedades, el cambio de uso del suelo y una trazabilidad deficiente pueden combinarse en una cadena de suministro vulnerable.","* Dependencia: los componentes certificados necesitan un material con prestaciones definidas.","* Vía de impacto: una expansión mal gestionada de las plantaciones de caucho puede contribuir a la transformación de hábitats, la contaminación o los conflictos sociales.","* Vía de riesgo: las enfermedades, los fenómenos meteorológicos extremos, las alteraciones comerciales o la pérdida de estado ecológico pueden reducir la disponibilidad o aumentar el coste y el plazo de suministro.","* Vía de control: la revisión de especificaciones, la trazabilidad del proveedor, la diversificación del abastecimiento, una certificación creíble, la resiliencia agronómica y la planificación de contingencias deben evaluarse conjuntamente. Un certificado de plantación no demuestra por sí solo que todo el riesgo esté controlado."],"title":"1.2.1: Caucho natural: dependencia biológica y riesgo de suministro"},{"kicker":"1.2.2","paragraphs":["El reporte relacionado con la naturaleza está evolucionando. Las Normas Europeas de Información sobre Sostenibilidad incluyen la ESRS E4 sobre biodiversidad y ecosistemas cuando el asunto resulta material conforme a los requisitos aplicables. TNFD ofrece recomendaciones voluntarias y el enfoque LEAP para localizar las interacciones con la naturaleza, evaluar dependencias e impactos, analizar riesgos y oportunidades y preparar una respuesta.","Los marcos ordenan las preguntas; no fabrican evidencias. Un reporte puede estar bien estructurado y seguir siendo débil si faltan ubicaciones, líneas base, límites o metodologías. El ámbito jurídico y las disposiciones transitorias también pueden cambiar, por lo que el personal debe utilizar la interpretación corporativa vigente y controlada, en lugar de tratar una diapositiva formativa como asesoramiento jurídico.","* La doble materialidad separa la materialidad de impacto —cómo afecta la organización a las personas y a la naturaleza— de la materialidad financiera —cómo pueden afectar las cuestiones de sostenibilidad al valor empresarial—. Un mismo hecho puede pertenecer a ambas perspectivas, pero las evidencias y los umbrales de decisión no son idénticos.","* Buena práctica: indica el perímetro del reporte, la fecha, la metodología, la incertidumbre y el responsable del dato. Si una afirmación se basa en una estimación o un modelo, indícalo."],"title":"1.2.2: Marcos de reporte: qué hacen y qué no hacen"},{"kicker":"1.2.3","paragraphs":["Riesgos de una Mala Gestión:","* Riesgo de Transición: Que las leyes cambien tan rápido que no podamos adaptar nuestras fábricas a tiempo, sufriendo multas millonarias.","* Riesgo Reputacional: Perder la confianza de los clientes y, sobre todo, de los empleados. El orgullo de pertenencia cae si la empresa es percibida como destructora de la naturaleza.","Oportunidades Estratégicas:","* Atracción de Talento: El 67% de los jóvenes ingenieros eligen empresas con una estrategia de sostenibilidad real. En un mercado de talento tan competitivo, ser líderes en protección de la biosfera es nuestra mejor herramienta de reclutamiento.","* Innovación y Ecodiseño: Entender la naturaleza nos lleva a la Biomímesis (copiar diseños de la naturaleza para hacer alas más eficientes) y a la Manufactura Aditiva (3D) para dejar de desperdiciar materiales caros y escasos."],"title":"1.2.3: Gobernanza: Riesgos y Oportunidades"},{"figureLabel":"Estado y conectividad de los ecosistemas","figureSrc":"images/m1/m1-apoyo.jpg","kicker":"1.3.1","paragraphs":["La biodiversidad incluye la diversidad dentro de las especies, entre especies y de los ecosistemas. La diversidad genética puede influir en la resistencia frente a enfermedades; la diversidad de especies configura las interacciones ecológicas; y la diversidad de ecosistemas aporta distintos hábitats y funciones a lo largo del territorio.","Por tanto, un simple recuento de especies no es suficiente. Dos emplazamientos pueden contener el mismo número de especies y diferir enormemente en el estado del hábitat, la abundancia, la conectividad y la presencia de especies amenazadas o invasoras. La evaluación debe considerar, como mínimo, extensión, estado, conectividad e importancia ecológica mediante indicadores adecuados a la ubicación.","* Línea base: descripción fechada de las condiciones antes de una intervención. Sin ella no puede demostrarse el cambio.","* Condición de referencia: estado ecológico utilizado para juzgar la degradación o la recuperación. Debe ser explícito; «más verde que antes» no es una metodología.","* Contrafactual: lo que probablemente habría ocurrido sin la actuación. Es necesario para atribuir un resultado al proyecto y no a la lluvia, la gestión del territorio u otro factor externo."],"title":"1.3.1: La naturaleza tiene varios niveles y el estado importa"},{"kicker":"1.3.2","paragraphs":["IPBES agrupa los principales impulsores directos de la pérdida de biodiversidad en los cambios de uso del suelo y del mar, la explotación directa de organismos, el cambio climático, la contaminación y las especies exóticas invasoras. Las actividades industriales pueden interactuar con varios impulsores al mismo tiempo.","El cambio de uso del suelo puede proceder de nuevos edificios, accesos, minería o producción de materias primas. La contaminación puede incluir nutrientes, sustancias peligrosas, ruido y luz, además de emisiones atmosféricas. Las especies invasoras pueden desplazarse mediante el transporte de mercancías, el suelo, los embalajes o la jardinería. El cambio climático modifica la idoneidad de los hábitats y puede intensificar otras presiones.","La unidad correcta de análisis es la vía de presión: actividad → presión → cambio del estado ecológico → efecto sobre los servicios ecosistémicos o las especies → consecuencia operativa o social. Esta cadena evita el lenguaje impreciso y revela qué control puede interrumpir realmente el impacto."],"title":"1.3.2: Los cinco impulsores directos y su relación con la aeronáutica"},{"kicker":"1.3.3","paragraphs":["La jerarquía de mitigación comienza por evitar, continúa reduciendo y después contempla la regeneración o restauración; las medidas destinadas a abordar los impactos residuales quedan para el final. SBTN expresa esta lógica mediante AR3T: evitar, reducir, regenerar y restaurar, y transformar los sistemas.","Evitar suele ser la opción más sólida porque impide el daño antes de que se produzca: reubicar una ocupación, cambiar el calendario, rediseñar la iluminación o elegir una superficie ya alterada. La reducción limita los impactos que todavía no pueden evitarse. La restauración repara el estado ecológico afectado y necesita línea base, método, periodo de mantenimiento y criterios de éxito.","La compensación nunca debe presentarse como permiso para saltarse la evitación. Una hectárea restaurada en otro lugar no equivale automáticamente a una hectárea perdida, porque difieren el tipo y estado del hábitat, la conectividad, la función ecológica, el desfase temporal y la probabilidad de éxito. El registro de decisión debe mostrar qué alternativas se analizaron y por qué sigue existiendo un impacto residual."],"title":"1.3.3: La jerarquía de mitigación: primero la secuencia, después los eslóganes"},{"kicker":"Resumen","paragraphs":["Este módulo nos ha enseñado que Airbus no es solo una empresa de máquinas, sino una empresa que depende de sistemas biológicos. Comprender los Límites Planetarios, gestionar la dependencia del caucho y cumplir con la CSRD no son tareas extras; son la base de nuestra supervivencia como líderes aeroespaciales. La biodiversidad es el seguro de vida de nuestra cadena de suministro."],"title":"4. Resumen y Conclusión del Módulo"}],"sources":[{"label":"Evaluación Mundial de IPBES: impulsores de la biodiversidad y base científica","url":"https://ipbes.net/global-assessment"},{"label":"TNFD: enfoque LEAP para la evaluación relacionada con la naturaleza","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"},{"label":"Science Based Targets Network: marco de actuación AR3T","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/act/"},{"label":"EFRAG Knowledge Hub: ESRS E4 Biodiversidad y Ecosistemas","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}],"support":"images/m1/m1-apoyo.jpg","tag":"Fundamentos del sistema","theme":{"accent":"#30495c","ink":"#15202b","line":"#c99a5b","panel":"#fbf7f0","soft":"#efe5d8"},"title":"Naturaleza y resiliencia como sistema operativo y estratégico"},{"case":"images/m2/m2-caso.jpg","closing":"El valor de la geointeligencia no reside en la belleza de una imagen, sino en una cadena trazable desde una pregunta definida hasta una decisión controlada, mostrando claramente la incertidumbre.","duration":"90–110 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. El radar puede reducir las lagunas de observación, especialmente con nubosidad u oscuridad, pero no elimina la necesidad de validación ecológica.","feedbackIncorrect":"Revisa la diferencia entre medición física, inferencia ecológica y atribución causal.","options":["Identifica directamente todas las especies situadas bajo el dosel.","Puede proporcionar mediciones independientes de las condiciones meteorológicas sobre estructura, humedad o cambio, pero la interpretación ecológica sigue necesitando validación.","Hace innecesarias las líneas base y los estudios de campo."],"question":"¿Qué puede aportar el radar de apertura sintética al seguimiento de la biodiversidad?","title":"Comprobación de conocimientos"},"hero":"images/m2/m2-hero.jpg","id":"m2","index":"02","objective":"Comprender qué pueden medir la observación óptica y radar de la Tierra, cómo una cadena de seguimiento convierte los píxeles en evidencia y dónde siguen siendo imprescindibles la verificación sobre el terreno y el control de la incertidumbre.","openingParagraphs":["La observación de la Tierra puede revelar cambios difíciles, peligrosos o costosos de vigilar únicamente desde el terreno. Los instrumentos ópticos registran la energía reflejada en determinadas longitudes de onda; los sistemas radar transmiten activamente una señal y pueden adquirir información a través de las nubes y durante la noche. Ninguno de estos sistemas «ve la biodiversidad» directamente. Miden propiedades físicas a partir de las cuales los analistas infieren cobertura del suelo, estado de la vegetación, humedad, alteración o cambio.","Airbus Defence and Space construye sistemas de observación de la Tierra y transforma datos geoespaciales en servicios para sus clientes. El reto profesional consiste en impedir que una imagen técnicamente impresionante se trate como prueba de un resultado ecológico. Un producto de seguimiento defendible conecta una pregunta de gestión, la elección del sensor, una línea base, el método de procesamiento, una muestra de validación, una declaración de incertidumbre y un umbral de decisión."],"openingTitle":"1. De la imagen a la evidencia apta para decidir","practical":{"correct":1,"feedbackCorrect":"Correcto. La combinación de sensores reduce los puntos ciegos, pero siguen siendo necesarias la alineación estacional, la validación de campo y un umbral de decisión.","feedbackIncorrect":"Todavía no. Una sola imagen o una puntuación compuesta inventada no resuelven la estacionalidad, el significado ecológico ni la atribución.","intro":"Escenario ficticio: existe un humedal estacional junto a un corredor de apoyo a ensayos. Hay imágenes ópticas mensuales, pero las nubes afectaron a cuatro adquisiciones recientes. Una serie radar muestra un cambio en la respuesta superficial, mientras que dos visitas de campo discrepan sobre la zona húmeda porque se realizaron en estaciones distintas. El equipo debe decidir si pueden comenzar unas obras de drenaje.","options":["Utilizar la imagen óptica más nítida e ignorar los datos anteriores porque tienen menor resolución.","Combinar la serie temporal, armonizar la estacionalidad, validar en campo la interpretación radar y aplicar un umbral de decisión acordado previamente.","Promediar los valores de los píxeles ópticos y radar en una única puntuación y tratarla como abundancia de especies."],"steps":["Reformula la decisión y define el elemento ecológico y el periodo temporal relevantes.","Construye una línea base estacional utilizando fechas comparables, no una única imagen.","Combina evidencias ópticas y radar y dirige la verificación de campo hacia la zona incierta.","Define el umbral de autorización o parada y registra las limitaciones antes de aprobar las obras."],"takeaway":"La teledetección es más sólida cuando forma parte de una cadena de evidencias y no cuando sustituye la interpretación ecológica.","title":"Caso de decisión: seguimiento de un humedal estacional"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 2.1: Los Ojos de la Tierra: Sensores de Nueva Generación"},{"figureLabel":"Óptica de ultra-alta resolución","figureSrc":"images/m2/m2-apoyo.jpg","kicker":"2.1.1","paragraphs":["Para gestionar la biodiversidad de forma efectiva, la resolución de la imagen es el factor determinante entre una suposición y una evidencia legal. En el pasado, los satélites de baja resolución solo permitían ver \"manchas verdes\" (bosque) o \"manchas marrones\" (tala). Airbus ha roto esta barrera técnica.","La Constelación Pléiades Neo: El nuevo estándar de 30 cm","Airbus opera la constelación más avanzada de su clase: Pléiades Neo. Compuesta por cuatro satélites idénticos, esta red ofrece una resolución nativa de 30 centímetros. Mientras que satélites públicos como Sentinel-2 ven el mundo en píxeles de 10 metros, Pléiades Neo puede ver objetos del tamaño de un plato desde el espacio.","* Identificación de Especies e Inventario Forestal: A 30 cm de resolución, la geointeligencia permite realizar inventarios forestales sin necesidad de equipos humanos sobre el terreno en zonas peligrosas o inaccesibles. Es posible identificar especies arbóreas individuales mediante el análisis de la arquitectura de la canopia (la forma de la copa) y su firma espectral.","* Evaluación de la Salud de la Canopia: Mediante bandas espectrales específicas (como el \"Deep Blue\" y el \"Red Edge\"), los satélites detectan el estrés hídrico o enfermedades en los árboles antes de que sean visibles al ojo humano, permitiendo actuar contra plagas que podrían devastar hábitats enteros.","* Ejemplo Real: Airbus colabora con la ONG Madagasikara Voakajy en Madagascar. Utilizando imágenes de alta resolución, se monitorean los fragmentos de bosque remanentes para proteger el hábitat de especies en peligro crítico como los lémures. La capacidad de ver senderos de apenas un metro permite detectar la intrusión humana en santuarios protegidos."],"title":"2.1.1: Óptica de Ultra-Alta Resolución (El detalle que salva especies)"},{"figureLabel":"Deforestación invisible","figureSrc":"images/m2/m2-caso.jpg","kicker":"2.1.2","paragraphs":["Es crucial no confundir \"deforestación\" con \"degradación forestal\". La deforestación es la eliminación total de un bosque. La degradación forestal, sin embargo, es la eliminación selectiva de los árboles más valiosos (ej. Caoba o Teca) manteniendo el resto de la cubierta vegetal intacta.","* La Detección de la Tala Selectiva: Desde satélites de baja resolución, un bosque degradado sigue pareciendo \"verde\". Sin embargo, Pléiades Neo detecta las \"brechas\" de luz que quedan cuando se extrae un solo árbol gigante y los caminos de arrastre de troncos (log landings) que suelen tener menos de 3 metros de ancho.","* Intervención Legal Preventiva: Detectar la extracción selectiva permite a las autoridades intervenir cuando el daño es aún reversible. Airbus proporciona estos datos como evidencia auditable en juicios contra la tala ilegal.","* Caso de Uso: El Servicio Starling: Desarrollado por Airbus con Earthworm Foundation, es utilizado por multinacionales como Nestlé o Ferrero para demostrar que sus proveedores no han degradado áreas protegidas. El sistema genera alertas automáticas basadas en la comparación de imágenes de ultra-alta resolución, eliminando el fraude documental."],"title":"2.1.2: Prevención de la Degradación: Detener la \"Deforestación Invisible\""},{"figureLabel":"Visión radar SAR","figureSrc":"images/m2/m2-hero.jpg","kicker":"2.1.3","paragraphs":["Las regiones de mayor biodiversidad (Congo, Amazonía) están cubiertas por nubes más de 250 días al año. Aquí, el Radar de Apertura Sintética (SAR) de Airbus es indispensable.","* ¿Qué es el Radar SAR? Es un sensor activo que emite sus propios pulsos de microondas y mide el rebote. Ve a través de nubes densas, humo, ceniza volcánica y en oscuridad total.","* TerraSAR-X y TanDEM-X: Estos satélites gemelos vuelan en formación precisa (interferometría) para crear mapas 3D del terreno (WorldDEM) con precisión milimétrica.","* Medición de Biomasa: El radar penetra parcialmente en el follaje, midiendo el volumen de los troncos. Esto permite \"pesar\" los bosques y calcular el carbono almacenado, algo vital para los acuerdos climáticos internacionales.","* Referencia: Airbus es el contratista principal de la misión Biomass de la ESA, diseñada para realizar un inventario 3D del carbono forestal global."],"title":"2.1.3: Visión Radar (SAR): El Escudo contra la \"Ceguera\" Ambiental"},{"kicker":"Capítulo","paragraphs":["Airbus es un pilar del programa Copernicus, la iniciativa de la UE y la ESA para la observación de la Tierra."],"title":"3. CAPÍTULO 2.2: Alianzas Globales y el Programa Copernicus"},{"figureLabel":"Monitoreo atmosférico y climático","figureSrc":"images/m2/m2-apoyo.jpg","kicker":"2.2.1","paragraphs":["* CAMS (Atmosphere Monitoring): Airbus fabrica instrumentos para las misiones Sentinel-4 y 5, rastreando contaminantes (  ,   ) e incendios forestales. En 2023, permitió rastrear el humo de los incendios de Canadá cruzando el Atlántico.","* C3S (Climate Change): Proporciona datos sobre el aumento del nivel del mar (Sentinel-6) y humedad del suelo. Airbus Protect utiliza estos datos para realizar evaluaciones de riesgo en aeropuertos, diseñando defensas naturales contra inundaciones."],"title":"2.2.1: CAMS y C3S: Monitoreo de la Atmósfera y el Clima"},{"figureLabel":"Verificación de restauración","figureSrc":"images/m2/m2-caso.jpg","kicker":"2.2.2","paragraphs":["Airbus proporciona el MRV (Monitoreo, Reporte y Verificación) independiente para proyectos de reforestación.","* Supervivencia de Plantones: Con 30 cm de resolución, verificamos individualmente si los árboles plantados sobreviven los primeros 24 meses.","* Ejemplo Real: Restauración de la Mata Atlántica en Brasil, conectando fragmentos de bosque para asegurar la diversidad genética de la fauna."],"title":"2.2.2: Colaboración con la UICN: Verificación de la Restauración"},{"kicker":"Capítulo","paragraphs":[],"title":"4. CAPÍTULO 2.3: Casos de Aplicación e Impacto Real"},{"figureLabel":"Protección oceánica","figureSrc":"images/m2/m2-hero.jpg","kicker":"2.3.1","paragraphs":["Los barcos ilegales apagan su sistema de identificación (AIS) para saquear santuarios marinos.","* La Solución Airbus: Cruzamos el eco físico detectado por el radar (TerraSAR-X) con las señales AIS. Si el radar detecta un barco donde no hay señal AIS, es un \"buque oscuro\". Programamos un satélite óptico para identificar su matrícula y aparejos, colaborando con Global Fishing Watch."],"title":"2.3.1: Vigilancia de \"Buques Oscuros\" (Protección Oceánica)"},{"kicker":"2.3.2","paragraphs":["Apoyamos a científicos para monitorear hábitats de chimpancés y proteger al oso andino en condiciones extremas."],"title":"2.3.2: Premios \"Satellites for Biodiversity\""},{"kicker":"Capítulo","paragraphs":[],"title":"5. CAPÍTULO 2.4: El Futuro: NEXT SPACE y Protección Planetaria"},{"kicker":"2.4.1","paragraphs":["Diseñamos satélites bajo el Ecodiseño Espacial para que se desintegren al final de su vida útil y participamos en misiones CleanSpace de limpieza orbital."],"title":"2.4.1: Sostenibilidad Espacial y Basura Espacial"},{"kicker":"2.4.2","paragraphs":["Cumplimos los protocolos del COSPAR para evitar la contaminación biológica:","1. Contaminación Directa: Evitar llevar microbios terrestres a otros mundos (ej. misión JUICE a Júpiter).","2. Contaminación Inversa: Sellado de muestras de otros planetas para proteger la biosfera terrestre (misión Mars Sample Return)."],"title":"2.4.2: Comité de Protección Planetaria (CoPP)"},{"kicker":"2.5.1","paragraphs":["Una serie temporal de satélite puede mostrar que la cobertura del dosel disminuyó después de una fecha. Por sí sola no demuestra quién causó el cambio, si la calidad del hábitat disminuyó en la misma proporción ni si una actuación corporativa produjo el resultado. La atribución exige una hipótesis causal, datos de contexto y, con frecuencia, evidencias de campo.","Tres distinciones protegen la calidad de la decisión. La detección pregunta si el cambio es visible. La clasificación pregunta de qué tipo de cambio se trata. La atribución pregunta por qué ocurrió y si una actuación concreta lo causó. Cada paso introduce incertidumbre y puede requerir evidencias diferentes.","* Falso positivo: el sistema señala un cambio que no se produjo, quizá debido a la sombra de una nube, al agua estacional o a un error de clasificación.","* Falso negativo: se omite una degradación real porque es menor que la resolución espacial, ocurre bajo el dosel o se produce entre dos fechas de adquisición.","* Umbral de decisión: nivel de evidencia que activa una inspección de campo, la intervención con un proveedor, una acción correctiva o una escalada. Debe definirse antes de revisar la imagen más conveniente."],"title":"2.5.1: Observar no es atribuir"},{"figureLabel":"De los datos geoespaciales a la decisión","figureSrc":"images/m2/m2-hero.jpg","kicker":"2.5.2","paragraphs":["Un flujo de trabajo fiable empieza por la decisión, no por el sensor. Primero se definen el activo, hábitat o área de suministro y la pregunta de gestión. Después se establece una línea base fechada y se eligen indicadores que respondan a la presión relevante. Solo entonces se seleccionan la resolución espacial, la frecuencia de revisita, las bandas espectrales, la geometría radar y el momento de adquisición.","El procesamiento debe ser reproducible: hay que documentar la fuente de datos, la corrección atmosférica o radiométrica, la versión del algoritmo, los datos de entrenamiento y los controles de calidad. La validación debe comparar los resultados con observaciones de campo independientes o datos de referencia de mayor confianza. Los resultados necesitan además un intervalo de incertidumbre y un umbral vinculado a una acción.","El último paso es la gobernanza. Un cuadro de mando sin responsable no constituye un control. Hay que especificar quién revisa las alertas, quién las verifica, qué evidencia se conserva, cuándo se escala un hallazgo y cómo se confirma su cierre. La geointeligencia genera valor cuando acorta el camino entre una señal débil y una decisión proporcionada."],"title":"2.5.2: La cadena de seguimiento: desde la pregunta hasta el control"},{"kicker":"Fuentes","paragraphs":[],"title":"Listado de Fuentes y Referencias: Módulo 2 Airbus"},{"kicker":"1","paragraphs":["* Airbus Defence and Space (2024): Geointelligence: Space Technology as a Protector of the Biosphere. Informe técnico sobre el uso de constelaciones satelitales para el monitoreo ambiental.","* Airbus Intelligence (2024): Pléiades Neo: Technical Specifications and User Guide. Detalles sobre la resolución de 30 cm y bandas espectrales.","* Airbus Protect (2024): Climate Risk Assessment for Infrastructure. Metodologías de uso de datos climáticos para la resiliencia de activos.","* Airbus Internal Document: Next Space Initiative: Sustainable Exploration and Planetary Protection.","* Airbus Committee on Planetary Protection (CoPP): Manual de Procedimientos y Cumplimiento de Protocolos COSPAR."],"title":"1. Documentación Primaria (Airbus)"},{"kicker":"2","paragraphs":["* Copernicus Programme (ESA / Comisión Europea):","* CAMS (Copernicus Atmosphere Monitoring Service): Datos sobre emisiones de aerosoles, incendios forestales y calidad del aire.","* C3S (Copernicus Climate Change Service): Indicadores de variables climáticas esenciales (ECV) y modelos de predicción.","* ESA (Agencia Espacial Europea): * Misión Biomass (P-band SAR): Datos técnicos sobre la medición de biomasa forestal desde el espacio.","* Sentinel-6 Michael Freilich: Documentación sobre la medición del nivel del mar.","* UICN (Unión Internacional para la Conservación de la Naturaleza):","* Restoration Barometer: Metodología para la verificación de compromisos de restauración de tierras (Desafío de Bonn).","* ECMWF (European Centre for Medium-Range Weather Forecasts): Datos de soporte para los servicios de Copernicus."],"title":"2. Programas e Instituciones Internacionales"},{"kicker":"3","paragraphs":["* COSPAR (Committee on Space Research): Policy on Planetary Protection. Estándares internacionales para evitar la contaminación biológica en misiones espaciales.","* Stockholm Resilience Centre: Planetary Boundaries Framework (2009/2023). Definición científica de los límites de estabilidad de la biosfera.","* ISO 14040 / 14044: Estándares internacionales para la Evaluación de Ciclo de Vida (LCA) aplicados a la fabricación de satélites y aeronaves.","* MDPI Encyclopedia: Life Cycle Assessment in Aviation. Revisión de impactos ambientales en la industria aeroespacial."],"title":"3. Marcos Científicos y Regulatorios"},{"kicker":"4","paragraphs":["* Earthworm Foundation: Metodología del servicio Starling para el monitoreo de la deforestación en cadenas de suministro de materias primas (aceite de palma, soja, cacao).","* Global Fishing Watch: The Dark Vessel Detection Project. Informes sobre el cruce de datos AIS y Radar SAR para combatir la pesca ilegal (IUU).","* Madagasikara Voakajy: Estudios de caso sobre el uso de imágenes Pléiades para la protección del hábitat de lémures en Madagascar.","* Connected Conservation Foundation: Reportes de los ganadores del premio Satellites for Biodiversity (casos del oso andino y chimpancés)."],"title":"4. Casos de Uso y Aplicaciones Técnicas"},{"kicker":"5","paragraphs":["* Misión JUICE (JUpiter ICy moons Explorer): Protocolos de limpieza y esterilización para la exploración de lunas heladas.","* Misión TerraSAR-X & TanDEM-X: Fundamentos de la interferometría SAR y generación del WorldDEM (Modelo Digital de Elevación).","* Misión Mars Sample Return (MSR): Diseño del Earth Return Orbiter y protocolos de seguridad para la contención de muestras biológicas (Contaminación Inversa)."],"title":"5. Referencias de Misiones Específicas"}],"sources":[{"label":"Airbus: satélites e imágenes de observación de la Tierra","url":"https://www.airbus.com/en/products-services/space/earth-observation"},{"label":"Airbus: capacidades de imágenes ópticas y radar","url":"https://www.airbus.com/en/products-services/space/earth-observation/satellite-imagery"},{"label":"Copernicus: programa europeo de observación de la Tierra","url":"https://www.copernicus.eu/en/about-copernicus"},{"label":"TNFD: guía para la evaluación relacionada con la naturaleza","url":"https://tnfd.global/publication/additional-guidance-on-assessment-of-nature-related-issues-the-leap-approach/"}],"support":"images/m2/m2-apoyo.jpg","tag":"Sistemas de evidencia","theme":{"accent":"#1f3f5b","ink":"#141c28","line":"#6d90aa","panel":"#f7f4ee","soft":"#dfeaf1"},"title":"Geointeligencia: observación de la Tierra para decisiones ambientales"},{"case":"images/m3/m3-caso.jpg","closing":"La finalidad del análisis preliminar es dirigir la atención de manera disciplinada: concentra el esfuerzo de investigación donde coinciden una presión material, una ubicación sensible y una evidencia débil.","duration":"95–115 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. La prioridad surge de la interacción entre el material, el lugar y la solidez de los controles.","feedbackIncorrect":"Revisa el modelo de análisis. El coste y el carbono pueden ser relevantes, pero ninguno recoge la vía de biodiversidad específica de la ubicación.","options":["Únicamente el gasto anual.","La vía de presión del material, la ubicación de abastecimiento, la sensibilidad ecológica, la trazabilidad y la calidad de los controles.","Únicamente las emisiones totales de carbono del proveedor."],"question":"¿Qué combinación resulta más útil para priorizar la diligencia debida de proveedores en materia de biodiversidad?","title":"Comprobación de conocimientos"},"hero":"images/m3/m3-hero.jpg","id":"m3","index":"03","objective":"Aprender cómo la ubicación, la materia prima, el nivel del proveedor y el estado ecológico determinan las dependencias y los impactos relacionados con la naturaleza, y cómo priorizar una diligencia debida más profunda sin fingir que los datos incompletos son precisos.","openingParagraphs":["Un producto aeronáutico conecta minas, fundiciones, plantas químicas, procesado de materiales compuestos, electrónica, materiales biológicos, logística, ensamblaje, mantenimiento y final de vida. Por tanto, la relación con la biodiversidad está distribuida entre ubicaciones y niveles de proveedores. Un promedio corporativo puede ocultar un problema local grave; y un mapa local detallado puede seguir sin mostrar una vía de impacto asociada a una materia prima situada aguas arriba.","El objetivo no consiste en asignar una única puntuación universal de biodiversidad a cada componente. Se trata de crear un proceso repetible de priorización: identificar flujos de materiales y ubicaciones, analizar presiones y dependencias plausibles, comprobar la calidad de la evidencia, investigar las combinaciones de alto riesgo y conectar los resultados con decisiones de compras o ingeniería."],"openingTitle":"1. Por qué la huella industrial se extiende más allá de la fábrica","practical":{"correct":1,"feedbackCorrect":"Correcto. La opción reconoce una trazabilidad más sólida, trata el problema pendiente como una acción de control y mantiene abierta una vía de reducción.","feedbackIncorrect":"Todavía no. La certificación no elimina las lagunas de evidencia y una sustitución sin análisis de ciclo de vida puede trasladar el impacto.","intro":"Escenario ficticio: dos proveedores ofrecen un componente de caucho natural que cumple la misma especificación técnica. El proveedor A es más barato y aporta un certificado genérico de sostenibilidad, pero no facilita las coordenadas de las plantaciones. El proveedor B aporta registros de cadena de custodia hasta grupos de pequeños productores, zonas de abastecimiento cartografiadas, un control de no transformación, resultados de auditoría y una acción correctiva abierta sobre gestión del agua. Una tercera opción de rediseño podría reducir un 12 % la demanda de material virgen, pero su cualificación tardaría nueve meses.","options":["Seleccionar al proveedor A porque un certificado elimina la necesidad de disponer de datos de ubicación.","Utilizar provisionalmente al proveedor B por su evidencia más sólida, gestionar la acción pendiente sobre el agua e iniciar la cualificación de la opción que reduce la demanda.","Rechazar inmediatamente todo material natural, con independencia de las prestaciones y de los impactos de las alternativas."],"steps":["Separa la conformidad técnica de las evidencias relacionadas con la naturaleza.","Compara la ubicación, la trazabilidad, el alcance de los controles y los hallazgos sin resolver.","Evalúa el rediseño como una vía de evitación o reducción sin comprometer la seguridad.","Registra el control de compra provisional y las evidencias necesarias en el siguiente punto de decisión."],"takeaway":"Una diligencia debida sólida combina los controles actuales con una vía creíble para reducir la presión subyacente.","title":"Caso de decisión: evidencias incompletas de proveedores"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 3.1: De la actividad a la consecuencia relacionada con la naturaleza"},{"figureLabel":"Uso del suelo y contexto ecológico","figureSrc":"images/m3/m3-hero.jpg","kicker":"3.1.1","paragraphs":["Una actividad adquiere relevancia para la decisión a través de una cadena causal. La extracción, la construcción, los vertidos, el transporte o el abastecimiento generan una presión como la transformación de hábitats, la captación de agua, la contaminación, las molestias o la introducción de especies. La presión modifica el estado ecológico —por ejemplo, la extensión del hábitat, la calidad del agua, la abundancia o la conectividad—. Ese cambio puede afectar a los servicios ecosistémicos y a las personas y, posteriormente, generar consecuencias operativas, legales, financieras o reputacionales.","Comenzar por esta cadena evita dos errores. El primero es saltar directamente desde una actividad hasta una afirmación de pérdida de biodiversidad sin evidencias. El segundo es medir una respuesta sencilla —como las horas de voluntariado— mientras se ignora la presión que origina el impacto.","* Los indicadores adelantados muestran si se están implantando los controles: porcentaje de proveedores prioritarios con coordenadas verificadas, realización de estudios estacionales o cierre de acciones correctivas.","* Los indicadores retardados muestran qué ocurrió con el estado ecológico: estado del hábitat, variables de calidad del agua, abundancia de una especie indicadora o cambio de la fragmentación.","* Los indicadores de contexto describen condiciones externas como la sequía, la transformación regional del suelo o la presencia de espacios protegidos. Ayudan a interpretar, pero no son automáticamente atribuibles a la empresa."],"title":"3.1.1: La cadena presión–estado–servicio–negocio"},{"kicker":"3.1.2","paragraphs":["La biodiversidad es espacialmente heterogénea. Una hectárea de suelo industrial ya sellado no equivale a una hectárea de humedal conectado, bosque maduro o hábitat utilizado por una especie amenazada. El momento también importa: una molestia durante la época de reproducción puede generar un riesgo distinto al de la misma actividad realizada en otra época.","Por ello, el análisis preliminar debe combinar la huella o el lugar de abastecimiento con el contexto ecológico. Entre las capas útiles se incluyen el tipo y estado del hábitat, las zonas protegidas o reconocidas internacionalmente, las áreas de distribución de especies amenazadas, el estrés hídrico, la conectividad, el potencial de restauración y las presiones acumuladas de otros agentes.","Los mapas no son veredictos. Los conjuntos de datos tienen distintas fechas, resoluciones y tasas de error. Una coincidencia cartográfica es un motivo para investigar; la ausencia en un mapa poco detallado no demuestra ausencia real. El registro de decisión debe indicar qué capas se utilizaron y dónde sigue siendo necesaria la evidencia de campo."],"title":"3.1.2: La ubicación importa más que una hectárea genérica"},{"kicker":"Capítulo","paragraphs":[],"title":"3. CAPÍTULO 3.2: Priorización de la cadena de valor ascendente"},{"kicker":"3.2.1","paragraphs":["Un modelo práctico de análisis utiliza tres dimensiones. La familia de materiales indica vías de presión plausibles: minería y refino, petroquímica, materias primas biológicas, electrónica, embalajes o energía. La ubicación aporta la sensibilidad ecológica y el contexto jurisdiccional. La calidad del control evalúa la trazabilidad, las evidencias del proveedor, el alcance de la certificación, el aseguramiento y la capacidad de aplicar acciones correctivas.","Un volumen elevado no determina por sí solo la prioridad. Un material de menor volumen procedente de una ubicación muy sensible y con trazabilidad deficiente puede requerir investigación antes que un flujo mayor de una fuente reciclada y bien controlada. Del mismo modo, una etiqueta de materia prima de alto riesgo no debe condenar a todos los proveedores: los controles y la evidencia del emplazamiento importan.","El resultado debe ser un nivel de riesgo y una solicitud de evidencias, no una afirmación pública. El nivel 1 puede requerir coordenadas, información de cadena de custodia, permisos, datos de agua y un plan de mejora. El nivel 2 puede necesitar confirmación y seguimiento periódico. El nivel 3 puede controlarse mediante los mecanismos habituales de compras."],"title":"3.2.1: Familia de materiales × ubicación × calidad del control"},{"figureLabel":"Trazabilidad y gestión del territorio","figureSrc":"images/m3/m3-apoyo.jpg","kicker":"3.2.2","paragraphs":["Las declaraciones de proveedores responden a quién suministró una pieza, pero las cuestiones de biodiversidad suelen requerir conocer de dónde procedía el material subyacente y cómo fue transformado. La cadena se complica cuando los intermediarios mezclan fuentes, se combinan contenidos reciclados y vírgenes o los proveedores de nivel 1 no disponen de visibilidad más allá de sus propios proveedores directos.","La solidez de la evidencia aumenta desde una declaración no verificada hasta la trazabilidad documentada, el aseguramiento independiente y, cuando corresponda, el seguimiento espacial. La certificación puede apoyar la diligencia debida, pero deben comprenderse el alcance del esquema, la frecuencia de auditoría, las operaciones excluidas y el mecanismo de reclamación.","Las cláusulas de compra deben especificar la información necesaria, el derecho a verificarla, los periodos de conservación, los desencadenantes de escalada y las expectativas de mejora. Ingeniería y Compras deben trabajar conjuntamente: una especificación que impida involuntariamente un material de menor impacto no puede resolverse únicamente mediante la relación con el proveedor."],"title":"3.2.2: Trazabilidad y cadena de custodia"},{"kicker":"3.2.3","paragraphs":["El capital natural describe los recursos naturales y sistemas ecológicos que generan flujos de beneficios. El concepto puede ayudar a los equipos empresariales a reconocer dependencias que los registros convencionales de activos omiten, como la regulación del agua o el control de la erosión.","La monetización puede facilitar algunas comparaciones, pero no debe borrar los límites ecológicos ni los derechos. El precio de mercado, el coste de reposición y el valor social responden a preguntas diferentes. Algunas pérdidas no son intercambiables de forma significativa y una estimación financiera no convierte en aceptable un impacto ecológico inaceptable.","Utiliza la valoración como una entrada más junto con la importancia ecológica, la protección legal, los derechos de las partes interesadas, la incertidumbre y la reversibilidad. Explica el método y evita sumar valores incompatibles en una única cifra llamativa pero opaca."],"title":"3.2.3: El capital natural es útil, pero no es un precio único"},{"kicker":"Capítulo","paragraphs":[],"title":"4. CAPÍTULO 3.3: Controles y decisiones sobre proveedores"},{"figureLabel":"Instalación industrial y hábitat circundante","figureSrc":"images/m3/m3-caso.jpg","kicker":"3.3.1","paragraphs":["Evitar en la cadena de suministro puede significar cambiar la procedencia de un material, excluir la transformación de hábitats críticos, rediseñar un componente, aumentar el contenido reciclado cuando las prestaciones lo permitan o utilizar una superficie ya alterada. Reducir puede implicar recirculación de agua, control de la contaminación, métodos extractivos de menor impacto o mejora de la logística.","La restauración en las instalaciones de un proveedor debe especificar el hábitat afectado, la línea base, el estado objetivo, el periodo de mantenimiento, el método de seguimiento y la solución aplicable si no se alcanzan los resultados. Comprar certificados o financiar un proyecto de conservación no relacionado no reduce por sí solo la presión de la cadena del producto.","Una decisión de abastecimiento creíble registra las compensaciones: requisitos de prestaciones y seguridad, volumen, ubicación, confianza de la evidencia, alternativas analizadas, impacto residual y fecha de la siguiente revisión. Cuando la evidencia es débil, la respuesta debe ser proporcionada: solicitar mejores datos, modificar las condiciones contractuales, auditar, colaborar en la mejora o, cuando sea necesario, cambiar de fuente."],"title":"3.3.1: Aplicar la jerarquía de mitigación aguas arriba"},{"kicker":"5","paragraphs":["La gestión de la biodiversidad en la cadena de valor es una disciplina de priorización. Combina conocimiento de los materiales, contexto espacial, trazabilidad y calidad de los controles; mantiene visible la incertidumbre; y vincula los resultados de alto riesgo con acciones de ingeniería, compras y desarrollo de proveedores."],"title":"5. Resumen del módulo"}],"sources":[{"label":"IPBES: Evaluación Mundial sobre biodiversidad y servicios ecosistémicos","url":"https://ipbes.net/global-assessment"},{"label":"TNFD: dependencias, impactos, riesgos y oportunidades relacionados con la naturaleza","url":"https://tnfd.global/"},{"label":"Science Based Targets Network: actuación empresarial para la naturaleza","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/"},{"label":"EFRAG: ESRS E4 Biodiversidad y Ecosistemas","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"}],"support":"images/m3/m3-apoyo.jpg","tag":"Riesgo en la cadena de valor","theme":{"accent":"#6d4a1d","ink":"#20180f","line":"#bb7d31","panel":"#fcf7ef","soft":"#f2dfc5"},"title":"Uso del suelo, cadenas de suministro y capital natural"},{"case":"images/m4/m4-caso.jpg","closing":"La participación auténtica no se define por un logotipo ni por el número de voluntarios. Se define por la capacidad de las personas para aportar evidencias, llegar al responsable adecuado y comprobar que la actuación se completa.","duration":"75–90 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. La participación aporta alcance y conocimiento local, mientras que los responsables formales conservan la autoridad técnica y de decisión.","feedbackIncorrect":"Revisa la arquitectura de gobernanza. Las redes refuerzan los controles cuando su función y sus vías de escalada son explícitas.","options":["Sustituir la función formal de gestión ambiental.","Actuar como red de aprendizaje y detección conectada con responsables técnicos y vías de escalada claramente identificados.","Aprobar de manera independiente las afirmaciones externas sobre biodiversidad."],"question":"¿Cuál es el papel más defendible para una red de empleados sobre biodiversidad?","title":"Comprobación de conocimientos"},"hero":"images/m4/m4-hero.jpg","id":"m4","index":"04","objective":"Comprender cómo se combinan los derechos formales de decisión, las funciones competentes y la participación de los empleados para convertir las observaciones sobre biodiversidad en actuaciones verificadas, en lugar de dejarlas como buenas intenciones aisladas.","openingParagraphs":["Los empleados suelen detectar cambios antes que un cuadro de mando: mortalidad inusual de fauna, agua estancada después de unas obras, ruido recurrente en un periodo sensible, una planta invasora junto a una zona de carga o una afirmación de un proveedor que no coincide con la evidencia. Esa percepción local es valiosa, pero solo se convierte en un control cuando existe una vía de verificación, asignación de responsabilidad, escalada y cierre.","Una comunidad de biodiversidad puede reforzar el aprendizaje organizativo y conectar a personas de distintas funciones. No debe sustituir a los especialistas ambientales, la gestión del emplazamiento, salud y seguridad, compras ni la gobernanza del programa. El reto de diseño consiste en combinar la observación distribuida con una autoridad clara y competencia técnica."],"openingTitle":"1. La participación necesita un sistema","practical":{"correct":1,"feedbackCorrect":"Correcto. La respuesta conserva la evidencia, controla una vía plausible y utiliza una verificación competente antes de formular una afirmación.","feedbackIncorrect":"Todavía no. Una buena gobernanza evita tanto la reacción excesiva como el rechazo; convierte la señal en una evaluación controlada.","intro":"Escenario ficticio: un compañero fotografía varias plantas desconocidas junto a una zona de carga después de desembalar equipos importados. Las plantas pueden ser inocuas, pero también podrían indicar una vía de entrada de especies invasoras. El compañero publica la imagen en un canal de la comunidad, aunque no existe una identificación confirmada.","options":["Iniciar inmediatamente una campaña pública de erradicación basándose en la fotografía.","Agradecer la observación, prevenir la dispersión accidental, enviar el registro para verificación especializada y actuar de acuerdo con el resultado confirmado.","Ignorar el aviso porque las observaciones de empleados no son datos formales."],"steps":["Conserva la ubicación y la fecha de la observación.","Evita mover tierra o material vegetal hasta completar el triaje.","Envía el registro al responsable ambiental del emplazamiento para una identificación competente.","Documenta la decisión y comparte el aprendizaje verificado sin nombrar prematuramente la especie."],"takeaway":"Una cultura sólida de notificación actúa con rapidez manteniendo separados los hechos, las hipótesis y las decisiones.","title":"Caso de decisión: una observación junto a la zona de carga"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 4.1: Arquitectura de gobernanza"},{"figureLabel":"Gobernanza interfuncional","figureSrc":"images/m4/m4-hero.jpg","kicker":"4.1.1","paragraphs":["La gobernanza responde a cuatro preguntas: quién observa, quién evalúa, quién decide y quién verifica el cierre. La confusión aparece cuando se invita a todos a participar, pero nadie es responsable de la decisión, o cuando una red entusiasta asume compromisos fuera de sus competencias.","Para cada cuestión material deben definirse una persona responsable, revisores técnicos, funciones consultadas y personas que deben ser informadas. El modelo concreto puede variar según el emplazamiento o el programa, pero la responsabilidad debe ser visible. Un registro de decisiones debe recoger la evidencia, las alternativas, la aprobación, el riesgo residual, el responsable de la acción y la fecha de revisión.","Los umbrales de escalada son igualmente importantes. Una posible afección a especies protegidas, un episodio de contaminación o una desviación de un permiso no deben esperar a una reunión de la comunidad. La vía debe conectarse de inmediato con el proceso ambiental o de seguridad controlado."],"title":"4.1.1: Derechos de decisión y responsabilidad"},{"kicker":"4.1.2","paragraphs":["El primer nivel es la responsabilidad operativa: los equipos que diseñan, compran, construyen, mantienen o gestionan una instalación controlan la actividad e implantan los requisitos. El segundo nivel aporta orientación especializada, normas, contraste y supervisión. El tercer nivel proporciona aseguramiento independiente sobre la fiabilidad de los controles y del reporte.","Las redes de empleados se sitúan junto a estos niveles como mecanismo de aprendizaje y detección. Pueden aportar conocimiento local, compartir métodos, conectar a compañeros y desarrollar propuestas. Deben contar con un patrocinador identificado, un contacto técnico y un límite claro entre concienciación, recomendación y aprobación formal.","Esta separación protege tanto la credibilidad como la participación. Las personas pueden contribuir sin asumir juicios ecológicos para los que no están formadas, y los equipos técnicos reciben un flujo más amplio de observaciones e ideas."],"title":"4.1.2: Tres niveles complementarios de responsabilidad"},{"kicker":"Capítulo","paragraphs":[],"title":"3. CAPÍTULO 4.2: De la observación a la actuación verificada"},{"figureLabel":"Red de observación y aprendizaje","figureSrc":"images/m4/m4-apoyo.jpg","kicker":"4.2.1","paragraphs":["Un informe útil describe qué se observó, dónde, cuándo y en qué condiciones y, cuando sea seguro y esté permitido, incluye una fotografía. Evita identificar una especie o una causa salvo que la persona observadora tenga competencia para hacerlo.","El triaje comprueba después la urgencia, las implicaciones legales o de seguridad, posibles duplicidades y la función responsable. Un especialista valida el asunto y define una actuación proporcionada. El cierre registra qué se hizo y si la situación mejoró. La respuesta a la persona que informó completa el ciclo de aprendizaje.","* Observar: registrar hechos, no conclusiones.","* Clasificar: dirigir de forma diferente las señales urgentes y las rutinarias.","* Verificar: utilizar evidencias competentes y, cuando sea necesario, una inspección de campo.","* Actuar: asignar un control con responsable y fecha límite.","* Cerrar y aprender: confirmar la eficacia y compartir el resultado."],"title":"4.2.1: Un flujo sencillo para gestionar observaciones"},{"kicker":"4.2.2","paragraphs":["Las personas comunican señales débiles cuando creen que sus preguntas serán tomadas en serio y que los errores no se ocultarán. La seguridad psicológica no significa rebajar los estándares técnicos; significa permitir que la incertidumbre se exprese con suficiente antelación para reunir evidencias.","Los responsables pueden favorecerla preguntando qué se sabe, qué se supone y qué podría cambiar la decisión. Los equipos deben valorar una escalada útil incluso cuando la investigación posterior demuestre que el riesgo era menor de lo previsto. Penalizar cada falsa alarma fomenta el silencio y genera sorpresas mayores.","El cuestionamiento constructivo resulta especialmente importante para las afirmaciones de sostenibilidad. Un compañero que pregunta por la línea base, el perímetro o la fuente está mejorando el trabajo, no bloqueando la comunicación."],"title":"4.2.2: Seguridad psicológica y cuestionamiento constructivo"},{"kicker":"Capítulo","paragraphs":[],"title":"4. CAPÍTULO 4.3: Medir la participación sin indicadores vacíos"},{"figureLabel":"Actuación local con apoyo técnico","figureSrc":"images/m4/m4-caso.jpg","kicker":"4.3.1","paragraphs":["El número de eventos, voluntarios o ideas son indicadores de actividad. Muestran que se han realizado acciones, pero no un beneficio ecológico. Los indicadores de resultado pueden incluir observaciones verificadas y resueltas, controles mejorados, tiempo transcurrido desde la señal hasta el triaje, lagunas de evidencia de proveedores cerradas o reducción de una presión definida.","Un cuadro de mando equilibrado utiliza ambos tipos. Las medidas de actividad ayudan a gestionar el alcance y la capacidad; las medidas de resultado comprueban si la participación modifica decisiones. El aprendizaje cualitativo también es valioso: los temas recurrentes pueden revelar un procedimiento que necesita rediseño o un campo de datos ausente en el sistema de compras.","Evita convertir cada aportación en una afirmación ambiental. Si no se ha medido un resultado sobre el hábitat, describe con precisión el resultado de gobernanza o aprendizaje."],"title":"4.3.1: Productos, resultados y aprendizaje"},{"kicker":"5","paragraphs":["La participación se vuelve operativa cuando las observaciones entran en un flujo controlado, las decisiones tienen responsables, los especialistas verifican el significado ecológico y la respuesta cierra el ciclo. La comunidad amplifica la gobernanza; no la sustituye."],"title":"5. Resumen del módulo"}],"sources":[{"label":"TNFD: recomendaciones sobre gobernanza y gestión de riesgos","url":"https://tnfd.global/recommendations/"},{"label":"ISO: introducción a los sistemas de gestión ambiental ISO 14001","url":"https://www.iso.org/iso-14001-environmental-management.html"},{"label":"IPBES: evaluaciones y conocimiento sobre biodiversidad","url":"https://ipbes.net/assessing-knowledge"}],"support":"images/m4/m4-apoyo.jpg","tag":"Gobernanza","theme":{"accent":"#315645","ink":"#17221c","line":"#6a9a7b","panel":"#f7f5ee","soft":"#dce8df"},"title":"Gobernanza, participación y cultura operativa"},{"case":"images/m5/m5-caso.jpg","closing":"La transparencia no es debilidad. Mostrar los límites, la incertidumbre y el impacto residual ofrece a quienes deciden la información necesaria y protege la confianza.","duration":"90–105 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. La afirmación define el perímetro, la métrica, la línea base y la limitación sin exceder lo demostrado por la evidencia.","feedbackIncorrect":"Revisa la arquitectura de evidencias. Las emisiones, la alineación con un marco y las buenas intenciones no demuestran por sí solas un resultado de biodiversidad.","options":["El proyecto no tiene impacto porque disminuyeron sus emisiones operativas.","Dentro del perímetro definido del proyecto, el indicador de presión X disminuyó un 18 % respecto a la línea base de 2024; se publican la metodología, las exclusiones y los impactos residuales.","El programa protege la biodiversidad porque sigue un marco reconocido."],"question":"¿Qué afirmación es la más creíble?","title":"Comprobación de conocimientos"},"hero":"images/m5/m5-hero.jpg","id":"m5","index":"05","objective":"Aprender a construir indicadores útiles para la decisión, distinguir las evidencias de las afirmaciones, aplicar la doble materialidad y comunicar el progreso sin ocultar límites, incertidumbre ni impactos residuales.","openingParagraphs":["El greenwashing no se evita sustituyendo palabras ambiciosas por palabras prudentes. Se evita mediante una cadena de evidencias: un objeto y un perímetro definidos, una línea base fechada, una métrica adecuada, un método transparente, responsabilidad asignada, control de calidad y una afirmación que no exceda lo demostrado por la evidencia.","Clima, circularidad, agua y biodiversidad pueden integrarse en una misma estrategia de sostenibilidad, pero necesitan indicadores diferentes. Combinarlos en una única puntuación solo puede ayudar a priorizar si el método y las compensaciones quedan visibles. Nunca debe implicar que la mejora de una cuestión neutraliza automáticamente el daño causado en otra."],"openingTitle":"1. La credibilidad es una arquitectura de evidencias","practical":{"correct":2,"feedbackCorrect":"Correcto. La reformulación conserva el hecho verificado, evita un resultado no respaldado y explica qué evidencia sigue siendo necesaria.","feedbackIncorrect":"Todavía no. Un recuento preciso de actividades no demuestra un resultado ecológico neto positivo, y sustituir un término vago por otro no resuelve la laguna de evidencia.","intro":"Borrador ficticio: «Nuestro emplazamiento ya es positivo para la naturaleza porque los empleados han plantado este año 500 árboles autóctonos». El equipo dispone de facturas y fotografías, pero no de un estudio de supervivencia, una línea base del hábitat, un plan de gestión del suelo ni una evaluación de las demás presiones del emplazamiento.","options":["Publicar el borrador porque el número exacto de árboles está documentado.","Cambiar «positivo para la naturaleza» por «verde» y mantener el resto.","Informar sobre la actividad de plantación verificada y el criterio de selección de especies, indicar que los resultados ecológicos aún no están demostrados y comprometerse con un plan de seguimiento definido solo si ya ha sido aprobado."],"steps":["Identifica la afirmación de resultado no respaldada y el perímetro ausente.","Separa la actividad verificada del resultado ecológico no medido.","Especifica la evidencia necesaria: línea base, indicadores de supervivencia y estado, periodo de mantenimiento, presiones y responsable.","Reescribe el mensaje para informar únicamente sobre lo que está respaldado en este momento."],"takeaway":"Una afirmación defendible es más limitada que el trabajo que la respalda y nunca más amplia que la evidencia.","title":"Caso de decisión: auditar una afirmación relacionada con la naturaleza"},"sections":[{"kicker":"Capítulo","paragraphs":[],"title":"2. CAPÍTULO 5.1: Construir la métrica antes que el mensaje"},{"figureLabel":"Evidencia, perímetro y metodología","figureSrc":"images/m5/m5-apoyo.jpg","kicker":"5.1.1","paragraphs":["Todo indicador necesita un perímetro: qué emplazamientos, proveedores, productos, actividades y etapas de la cadena de valor están incluidos. También necesita una fecha o periodo de referencia, una unidad y una frecuencia de reporte. Sin estos elementos, no puede interpretarse un porcentaje de mejora.","Un indicador de biodiversidad puede describir una presión, el estado ecológico, una respuesta o la gobernanza. Algunos ejemplos son las hectáreas de hábitat transformado, parámetros de calidad del agua, el estado de un hábitat definido, el número de proveedores prioritarios con coordenadas de abastecimiento verificadas o el porcentaje de acciones correctivas cerradas a tiempo.","No mezcles unidades diferentes sin explicar el modelo. Un índice global puede apoyar el análisis preliminar, pero una puntuación no sustituye las mediciones subyacentes cuando una decisión afecta a un lugar concreto."],"title":"5.1.1: Perímetro, línea base, unidad y periodo"},{"kicker":"5.1.2","paragraphs":["Los indicadores de presión suelen estar próximos al control operativo: suelo alterado, agua captada, carga contaminante, intensidad de iluminación nocturna o demanda de material virgen. Los indicadores de estado describen la condición ecológica. Los indicadores de respuesta describen actuaciones como la implantación de controles de evitación o el mantenimiento de una restauración.","Una respuesta no es un resultado. Plantar ejemplares registra una actividad; su supervivencia, la estructura del hábitat y la función ecológica a lo largo del tiempo describen el desempeño. Incluso entonces, la atribución debe contrastarse con la meteorología, las tendencias de fondo y la actuación de otros gestores del territorio.","Cuando la causalidad es incierta, utiliza un lenguaje preciso: «asociado con», «observado dentro del área controlada» o «coherente con» pueden ser defendibles cuando «causado por» no lo es."],"title":"5.1.2: Presión, estado, respuesta y atribución"},{"kicker":"5.1.3","paragraphs":["Las evidencias pueden ordenarse según su aptitud para el propósito. Una afirmación verbal o una imagen sin fecha es débil. Una declaración documentada del proveedor es más sólida, aunque puede seguir sin verificar. Los registros trazables, el análisis reproducible, la validación independiente y el aseguramiento aumentan la confianza.","Las dimensiones de calidad incluyen integridad, exactitud, actualidad, coherencia, resolución espacial y trazabilidad del dato. El mejor conjunto de datos no siempre es el más detallado, sino el que responde a la pregunta de decisión con un nivel de incertidumbre aceptable.","Mantén un registro de evidencias que vincule cada afirmación publicada con su fuente, responsable, cálculo, revisión y fecha de caducidad. Cuando cambien los datos subyacentes, la afirmación debe revisarse."],"title":"5.1.3: Calidad del dato y escala de evidencias"},{"kicker":"Capítulo","paragraphs":[],"title":"3. CAPÍTULO 5.2: Marcos y materialidad"},{"kicker":"5.2.1","paragraphs":["ESRS E4 aborda la biodiversidad y los ecosistemas dentro del reporte europeo de sostenibilidad cuando la cuestión es material y resulta aplicable. TNFD ofrece recomendaciones para informar sobre dependencias, impactos, riesgos y oportunidades relacionados con la naturaleza, respaldadas por el enfoque de evaluación LEAP. SBTN desarrolla métodos para que las empresas evalúen presiones, establezcan prioridades y definan objetivos basados en la ciencia para la naturaleza.","Estas herramientas pueden apoyarse mutuamente, pero no son intercambiables. Una evaluación de riesgos alineada con TNFD no equivale automáticamente a un objetivo validado basado en la ciencia. Un objetivo no demuestra su cumplimiento. Un requisito de reporte no es una metodología para medir todos los resultados ecológicos.","Los requisitos regulatorios y las versiones de los marcos evolucionan. Las directrices corporativas controladas y los documentos vigentes prevalecen sobre los ejemplos de este curso."],"title":"5.2.1: ESRS E4, TNFD y SBTN cumplen funciones diferentes"},{"figureLabel":"Revisión y aseguramiento","figureSrc":"images/m5/m5-hero.jpg","kicker":"5.2.2","paragraphs":["La materialidad de impacto pregunta cómo afecta la organización a las personas y al medio ambiente. La materialidad financiera pregunta cómo las cuestiones de sostenibilidad generan o pueden generar efectos financieros. Un mismo asunto de biodiversidad puede ser material desde ambas perspectivas, pero la evaluación debe mostrar las vías causales en lugar de contabilizar dos veces la misma evidencia.","La afección a un humedal puede ser material por su importancia ecológica y para las partes interesadas afectadas. La misma relación con el emplazamiento puede generar retrasos de permisos, exposición a inundaciones o costes de reparación. Son perspectivas conectadas, no una única puntuación intercambiable.","La materialidad no autoriza a ignorar operativamente todas las cuestiones no materiales. Las obligaciones legales, las condiciones de los permisos y los controles locales siguen siendo aplicables. La materialidad determina el foco del reporte; no sustituye el cumplimiento ni la gestión."],"title":"5.2.2: Doble materialidad sin doble contabilización"},{"kicker":"Capítulo","paragraphs":[],"title":"4. CAPÍTULO 5.3: Reconocer los patrones de greenwashing"},{"figureLabel":"Revisión de afirmaciones bajo escrutinio","figureSrc":"images/m5/m5-caso.jpg","kicker":"5.3.1","paragraphs":["Las afirmaciones vagas utilizan términos como «ecológico», «natural» o «sin impacto» sin definir el atributo. Las afirmaciones absolutas ocultan el impacto residual. La selección interesada destaca una pequeña iniciativa y omite la huella relevante. La falsa equivalencia trata las plantaciones, las emisiones evitadas y el estado del hábitat como si fueran intercambiables.","La omisión del perímetro informa sobre un emplazamiento o producto como si representara a toda la organización. La manipulación de la línea base selecciona un año conveniente. La exageración causal atribuye a la empresa una tendencia que puede tener otros impulsores. El future-washing presenta una aspiración como si su ejecución ya estuviera garantizada.","La solución es un lenguaje específico: identifica la actuación, el objeto, el perímetro, la línea base, el periodo, la métrica, el resultado, el método y la limitación. Si existe aseguramiento independiente, describe su alcance con precisión."],"title":"5.3.1: Fallos habituales en las afirmaciones"},{"kicker":"5.3.2","paragraphs":["Antes de publicar, pregunta: ¿qué cambió exactamente? ¿Respecto a qué línea base? ¿Dentro de qué perímetro y periodo? ¿Qué métrica y método se utilizaron? ¿Quién es responsable de los datos y quién los revisó? ¿Qué incertidumbre o impacto residual permanece? ¿Podría una persona razonable interpretar más de lo que demuestra la evidencia?","La última pregunta es fundamental. Una frase técnicamente cierta puede seguir siendo engañosa por sus imágenes, su posición o el contexto omitido. Revisa la comunicación completa, no solo la nota a pie de página numérica.","Si la evidencia no está preparada, modifica el mensaje o retrasa la afirmación. Los plazos de comunicación no mejoran la calidad de los datos."],"title":"5.3.2: Una prueba de siete preguntas"},{"kicker":"6","paragraphs":["La comunicación responsable sobre sostenibilidad comienza dentro del sistema de gestión. Primero se definen métricas, controles, revisión y aseguramiento; la afirmación pública es la expresión final y limitada de esas evidencias."],"title":"6. Resumen del módulo"}],"sources":[{"label":"Comisión Europea: reporte corporativo de sostenibilidad","url":"https://finance.ec.europa.eu/financial-markets/company-reporting-and-auditing/company-reporting/corporate-sustainability-reporting_en"},{"label":"EFRAG: ESRS E4 Biodiversidad y Ecosistemas","url":"https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-e4-biodiversity-and-ecosystems/"},{"label":"TNFD: recomendaciones de divulgación","url":"https://tnfd.global/recommendations/"},{"label":"Science Based Targets Network: metodologías y marco de actuación","url":"https://sciencebasedtargetsnetwork.org/companies/take-action/"}],"support":"images/m5/m5-apoyo.jpg","tag":"Evidencia y afirmaciones","theme":{"accent":"#463065","ink":"#1a1823","line":"#8b68b7","panel":"#f8f5fb","soft":"#e8def4"},"title":"Medición, reporte y comunicación responsable"},{"case":"images/m1/m1-caso.jpg","closing":"Has completado el ciclo de decisión completo: comprender el sistema, localizar la interacción con la naturaleza, evaluar evidencias, comparar controles, asignar responsabilidades y comunicar únicamente lo demostrado por la evidencia.","duration":"105–125 min","evaluation":{"correct":1,"feedbackCorrect":"Correcto. La capacidad de defensa procede de un proceso de decisión revisable y de una cadena de evidencias.","feedbackIncorrect":"Vuelve al apartado sobre el expediente de decisión. Las etiquetas y la restauración no sustituyen la evidencia específica del lugar ni la evitación.","options":["Una etiqueta reconocida y una puntuación de sostenibilidad combinada elevada.","Una cadena trazable desde la necesidad y la evidencia específica de la ubicación hasta las alternativas, la mitigación, la responsabilidad, la incertidumbre y el impacto residual.","Una promesa de restauración formulada antes de estudiar alternativas de evitación."],"question":"¿Qué hace técnicamente defendible una decisión sobre biodiversidad?","title":"Comprobación final de conocimientos"},"hero":"images/m2/m2-hero.jpg","id":"m6","index":"06","objective":"Integrar todo el curso en una decisión ficticia de programa: definir el sistema, localizar presiones y dependencias, comparar alternativas, gestionar la incertidumbre y redactar una afirmación capaz de superar una revisión técnica.","openingParagraphs":["Este laboratorio no utiliza datos confidenciales de programas ni representa una decisión oficial de Airbus. Combina información ficticia sobre una zona de apoyo al mantenimiento de A400M y un cambio en el suministro de un componente de Eurofighter para que el alumnado pueda practicar el método de forma segura.","La tarea no consiste en encontrar una opción «verde» perfecta. Consiste en adoptar una decisión trazable bajo determinadas restricciones: la seguridad y la aeronavegabilidad son innegociables, la evidencia ecológica está incompleta, los impactos se producen en lugares y momentos diferentes y algunos controles requieren colaboración entre Ingeniería, Compras, In
